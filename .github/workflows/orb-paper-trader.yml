name: orb-paper-trader
on:
  schedule:
    - cron: "7,22,37,52 13-21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orb-paper-trader
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy yfinance
      - run: python orb_paper_trader.py
      - name: Guardar estado
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "estado orb paper trader"
          git pull --rebase
          git push
